    <style>
      /* в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
       CSS CUSTOM PROPERTIES вЂ” Theme System
       вњ… FIX: Magic strings o'rniga CSS variables
       Supports both dark and light mode
    в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ */
      :root {
        /* Layout */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);

        /* Accent (overridden by JS from tweaks) */
        --accent: #8b5cf6;
        --accent-glow: rgba(139, 92, 246, 0.35);
        --premium-color: #fbbf24;
        --success-color: #22c55e;
        --danger-color: #ef4444;

        /* Typography */
        --font-display:
          -apple-system, "SF Pro Display", "SF Pro", system-ui, sans-serif;

        /* Radius */
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 18px;
        --radius-xl: 22px;
        --radius-full: 9999px;
      }

      /* в”Ђв”Ђв”Ђ Dark Theme (default) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      :root[data-theme="dark"] {
        --bg-page: radial-gradient(
          ellipse at top,
          #1a1530 0%,
          #0a0a0f 40%,
          #08080d 100%
        );
        --bg-solid: #0a0a0f;
        --bg-nav: rgba(20, 20, 28, 0.82);
        --bg-sheet: #15151d;
        --bg-surface-1: rgba(255, 255, 255, 0.03);
        --bg-surface-2: rgba(255, 255, 255, 0.05);
        --bg-surface-3: rgba(255, 255, 255, 0.08);

        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-light: rgba(255, 255, 255, 0.08);
        --border-medium: rgba(255, 255, 255, 0.12);

        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.78);
        --text-muted: rgba(255, 255, 255, 0.5);
        --text-faint: rgba(255, 255, 255, 0.35);

        --scrim: rgba(0, 0, 0, 0.55);
        --nav-gradient: linear-gradient(
          180deg,
          rgba(10, 10, 15, 0) 0%,
          rgba(10, 10, 15, 0.85) 35%,
          #0a0a0f 75%
        );
      }

      /* в”Ђв”Ђв”Ђ Light Theme в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      :root[data-theme="light"] {
        --bg-page: radial-gradient(
          ellipse at top,
          #ede9fe 0%,
          #f5f3ff 40%,
          #fafafa 100%
        );
        --bg-solid: #f5f3ff;
        --bg-nav: rgba(245, 243, 255, 0.92);
        --bg-sheet: #ffffff;
        --bg-surface-1: rgba(0, 0, 0, 0.05);
        --bg-surface-2: rgba(0, 0, 0, 0.07);
        --bg-surface-3: rgba(0, 0, 0, 0.11);

        --border-subtle: rgba(0, 0, 0, 0.09);
        --border-light: rgba(0, 0, 0, 0.12);
        --border-medium: rgba(0, 0, 0, 0.18);

        --text-primary: #0d0d1a;
        --text-secondary: rgba(13, 13, 26, 0.75);
        --text-muted: rgba(13, 13, 26, 0.52);
        --text-faint: rgba(13, 13, 26, 0.36);

        --scrim: rgba(0, 0, 0, 0.45);
        --nav-gradient: linear-gradient(
          180deg,
          rgba(245, 243, 255, 0) 0%,
          rgba(245, 243, 255, 0.92) 35%,
          #f5f3ff 75%
        );
      }

      /* в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ
       BASE RESET
    в•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђв•ђ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-solid);
        font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }

      body {
        overflow: hidden;
      }

      /* вњ… FIX: Focus visible for keyboard accessibility */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      /* вњ… NEW: Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* в”Ђв”Ђв”Ђ Scrollbar hiding в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
      .hide-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .page-scroll::-webkit-scrollbar {
        width: 0;
      }

      /* в”Ђв”Ђв”Ђ Press micro-animation в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      .press {
        transition:
          transform 0.13s cubic-bezier(0.3, 0.7, 0.4, 1),
          opacity 0.13s ease;
        transform-origin: center;
      }
      .press:active {
        transform: scale(0.955);
        opacity: 0.86;
      }

      /* в”Ђв”Ђв”Ђ Page fade-in в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      .page-fade {
        animation: pageFade 0.32s cubic-bezier(0.3, 0.7, 0.4, 1) both;
      }
      @keyframes pageFade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* в”Ђв”Ђв”Ђ Skeleton loading в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      @keyframes skel {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--bg-surface-1),
          var(--bg-surface-3),
          var(--bg-surface-1)
        );
        background-size: 200% 100%;
        animation: skel 1.5s infinite linear;
      }

      /* в”Ђв”Ђв”Ђ Pulse animation в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      @keyframes pulse {
        0% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }

      /* в”Ђв”Ђв”Ђ Spinner в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3.5px solid var(--bg-surface-3);
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* в”Ђв”Ђв”Ђ Inputs в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      textarea,
      input {
        font-family: inherit;
        color: var(--text-primary);
      }
      textarea::placeholder,
      input::placeholder {
        color: var(--text-muted);
      }

      /* в”Ђв”Ђв”Ђ Selection в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      ::selection {
        background: var(--accent-glow);
      }

      /* в”Ђв”Ђв”Ђ Toast в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      .toast-enter {
        opacity: 0;
        transform: translateY(-16px) scale(0.95);
      }
      .toast-active {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .toast-exit {
        opacity: 0;
        transform: translateY(-8px) scale(0.97);
        transition: all 0.2s ease;
      }

      /* в”Ђв”Ђв”Ђ Sheet drag handle в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      .sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: var(--radius-full);
        background: var(--border-medium);
        margin: 10px auto 6px;
        flex-shrink: 0;
      }

      /* в”Ђв”Ђв”Ђ Category pill active glow в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
      .cat-pill-active {
        box-shadow: 0 4px 14px var(--accent-glow);
      }
    </style>
  </head>

    <div id="root"></div>

    <script>
      window.onerror = function(msg, src, line, col, err) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="color:#ef4444;padding:20px;font-family:monospace;font-size:13px;word-break:break-all"><b>JS Error:</b><br>' + msg + '<br><small>' + (src||'') + ':' + line + '</small></div>';
        }
        return false;
      };
      window.onunhandledrejection = function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="color:#ef4444;padding:20px;font-family:monospace;font-size:13px;word-break:break-all"><b>Promise Error:</b><br>' + (e.reason||'Unknown') + '</div>';
        }
      };
    </script>
