<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ FIX: viewport-fit=cover — iPhone safe area uchun -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- ✅ NEW: Telegram theme color -->
    <meta name="theme-color" content="#0a0a0f" />
    <!-- ✅ NEW: App meta -->
    <meta
      name="description"
      content="EduBot — Talabalar uchun 38+ ta AI va bepul asboblar"
    />
    <meta name="application-name" content="EduBot" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- ✅ NEW: Open Graph -->
    <meta property="og:title" content="EduBot — Student Tools" />
    <meta
      property="og:description"
      content="38+ ta bepul va AI xizmatlar talabalar uchun"
    />
    <meta property="og:type" content="website" />
    <!-- ✅ NEW: CSP header hints (actual CSP header should be set server-side) -->
    <title>EduBot — Telegram Mini App</title>

    <!-- ✅ NEW: Preconnect for faster CDN loading -->
    <link rel="preconnect" href="https://telegram.org" />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />

    <style>
      /* ═══════════════════════════════════════════════
       CSS CUSTOM PROPERTIES — Theme System
       ✅ FIX: Magic strings o'rniga CSS variables
       Supports both dark and light mode
    ═══════════════════════════════════════════════ */
      :root {
        /* Layout */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);

        /* Accent (overridden by JS from tweaks) */
        --accent: #8b5cf6;
        --accent-glow: rgba(139, 92, 246, 0.35);
        --premium-color: #fbbf24;
        --success-color: #22c55e;
        --danger-color: #ef4444;

        /* Typography */
        --font-display:
          -apple-system, "SF Pro Display", "SF Pro", system-ui, sans-serif;

        /* Radius */
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 18px;
        --radius-xl: 22px;
        --radius-full: 9999px;
      }

      /* ─── Dark Theme (default) ─────────────────── */
      :root[data-theme="dark"] {
        --bg-page: radial-gradient(
          ellipse at top,
          #1a1530 0%,
          #0a0a0f 40%,
          #08080d 100%
        );
        --bg-solid: #0a0a0f;
        --bg-nav: rgba(20, 20, 28, 0.82);
        --bg-sheet: #15151d;
        --bg-surface-1: rgba(255, 255, 255, 0.03);
        --bg-surface-2: rgba(255, 255, 255, 0.05);
        --bg-surface-3: rgba(255, 255, 255, 0.08);

        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-light: rgba(255, 255, 255, 0.08);
        --border-medium: rgba(255, 255, 255, 0.12);

        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.78);
        --text-muted: rgba(255, 255, 255, 0.5);
        --text-faint: rgba(255, 255, 255, 0.35);

        --scrim: rgba(0, 0, 0, 0.55);
        --nav-gradient: linear-gradient(
          180deg,
          rgba(10, 10, 15, 0) 0%,
          rgba(10, 10, 15, 0.85) 35%,
          #0a0a0f 75%
        );
      }

      /* ─── Light Theme ──────────────────────────── */
      :root[data-theme="light"] {
        --bg-page: radial-gradient(
          ellipse at top,
          #f0eeff 0%,
          #f8f7ff 40%,
          #ffffff 100%
        );
        --bg-solid: #f8f7ff;
        --bg-nav: rgba(248, 247, 255, 0.88);
        --bg-sheet: #ffffff;
        --bg-surface-1: rgba(0, 0, 0, 0.03);
        --bg-surface-2: rgba(0, 0, 0, 0.05);
        --bg-surface-3: rgba(0, 0, 0, 0.08);

        --border-subtle: rgba(0, 0, 0, 0.06);
        --border-light: rgba(0, 0, 0, 0.08);
        --border-medium: rgba(0, 0, 0, 0.12);

        --text-primary: #0a0a14;
        --text-secondary: rgba(10, 10, 20, 0.78);
        --text-muted: rgba(10, 10, 20, 0.5);
        --text-faint: rgba(10, 10, 20, 0.35);

        --scrim: rgba(0, 0, 0, 0.4);
        --nav-gradient: linear-gradient(
          180deg,
          rgba(248, 247, 255, 0) 0%,
          rgba(248, 247, 255, 0.9) 35%,
          #f8f7ff 75%
        );
      }

      /* ═══════════════════════════════════════════════
       BASE RESET
    ═══════════════════════════════════════════════ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-solid);
        font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }

      body {
        overflow: hidden;
      }

      /* ✅ FIX: Focus visible for keyboard accessibility */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      /* ✅ NEW: Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ─── Scrollbar hiding ─────────────────────── */
      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
      .hide-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .page-scroll::-webkit-scrollbar {
        width: 0;
      }

      /* ─── Press micro-animation ────────────────── */
      .press {
        transition:
          transform 0.13s cubic-bezier(0.3, 0.7, 0.4, 1),
          opacity 0.13s ease;
        transform-origin: center;
      }
      .press:active {
        transform: scale(0.955);
        opacity: 0.86;
      }

      /* ─── Page fade-in ─────────────────────────── */
      .page-fade {
        animation: pageFade 0.32s cubic-bezier(0.3, 0.7, 0.4, 1) both;
      }
      @keyframes pageFade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ─── Skeleton loading ─────────────────────── */
      @keyframes skel {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--bg-surface-1),
          var(--bg-surface-3),
          var(--bg-surface-1)
        );
        background-size: 200% 100%;
        animation: skel 1.5s infinite linear;
      }

      /* ─── Pulse animation ──────────────────────── */
      @keyframes pulse {
        0% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }

      /* ─── Spinner ──────────────────────────────── */
      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3.5px solid var(--bg-surface-3);
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── Inputs ───────────────────────────────── */
      textarea,
      input {
        font-family: inherit;
        color: var(--text-primary);
      }
      textarea::placeholder,
      input::placeholder {
        color: var(--text-muted);
      }

      /* ─── Selection ────────────────────────────── */
      ::selection {
        background: var(--accent-glow);
      }

      /* ─── Toast ────────────────────────────────── */
      .toast-enter {
        opacity: 0;
        transform: translateY(-16px) scale(0.95);
      }
      .toast-active {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .toast-exit {
        opacity: 0;
        transform: translateY(-8px) scale(0.97);
        transition: all 0.2s ease;
      }

      /* ─── Sheet drag handle ────────────────────── */
      .sheet-handle {
        width: 36px;
        height: 4px;
        border-radius: var(--radius-full);
        background: var(--border-medium);
        margin: 10px auto 6px;
        flex-shrink: 0;
      }

      /* ─── Category pill active glow ────────────── */
      .cat-pill-active {
        box-shadow: 0 4px 14px var(--accent-glow);
      }
    </style>
  </head>
  <body>
    <!-- ✅ NEW: Accessible skip link -->
    <a href="#root" class="sr-only" style="position: absolute; left: -9999px"

    <div id="root" role="main"></div>

          <h2>JavaScript kerak</h2>
          <p>EduBot'ni ishlatish uchun brauzeringizda JavaScript'ni yoqing.</p>
        </div>
      </div>
    </noscript>

  </body>
