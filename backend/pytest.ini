[pytest]
pythonpath = . tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
asyncio_mode = auto
markers =
    fast: pure-function and endpoint tests with no external services (run on every push)
    slow: ML-heavy tests (rembg, PaddleOCR, MediaPipe) — deselect with '-m "not slow"'
    integration: requires external services (LibreOffice, Ghostscript, Tesseract, network)
